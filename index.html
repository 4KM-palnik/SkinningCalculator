<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skinning Calculator</title>
<style>

:root{
  --paper:#f5f4ee; --card:#fffefb; --ink:#141413; --muted:#73726c;
  --line:#e6e3d8; --blue:#c6613f; --blue-soft:#f6e4dc; --gold:#141413; --err:#b3261e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --mono:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#262624; --card:#30302e; --ink:#faf9f5; --muted:#a6a39a;
    --line:#434340; --blue:#d97757; --blue-soft:#4a352d; --gold:#faf9f5; --err:#ff8a7d;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.app{max-width:1060px;margin:0 auto;padding:32px 20px 56px;display:grid;
  grid-template-columns:minmax(280px,380px) 1fr;gap:20px;
  grid-template-areas:"top top" "controls graph" "results results"}
.top{grid-area:top;max-width:60ch}
h1{margin:0 0 6px;font-size:2rem;letter-spacing:-.02em}
.top p{margin:0;color:var(--muted)}
h2{margin:0;font-size:1.1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.controls{grid-area:controls;display:flex;flex-direction:column;gap:20px}
.graph-panel{grid-area:graph}
.results{grid-area:results}
.field{border:0;margin:0;padding:0;min-width:0}
label,legend{display:block;font-weight:600;margin-bottom:8px;padding:0}
.hint{margin:6px 0 0;font-size:.875rem;color:var(--muted)}
.hint.error{color:var(--err)}

.stepper{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content}
.stepper button{width:44px;border:0;background:var(--paper);color:var(--ink);font-size:1.25rem;cursor:pointer}
.stepper button:hover{background:var(--blue-soft)}
.stepper input{width:90px;border:0;border-inline:1px solid var(--line);text-align:center;
  font:600 1.1rem var(--mono);background:var(--card);color:var(--ink);padding:10px 0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}

.curves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.curve{position:relative}
.curve input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.curve span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;
  border:1px solid var(--line);border-radius:8px;font-size:.8125rem;text-align:center;background:var(--card)}
.curve svg{width:44px;height:44px}
.curve path{fill:none;stroke:var(--muted);stroke-width:2.5}
.curve:hover span{border-color:var(--blue)}
.curve input:checked + span{border-color:var(--blue);background:var(--blue-soft);font-weight:600}
.curve input:checked + span path{stroke:var(--blue)}
.curve input:focus-visible + span{outline:3px solid var(--blue);outline-offset:2px}

.graph-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.formula{font:.8125rem var(--mono);color:var(--muted)}
#graph{width:100%;max-height:440px;display:block}
#graph .grid{stroke:var(--line);stroke-width:1}
#graph .axis{stroke:var(--muted);stroke-width:1.5}
#graph .diag{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}
#graph .curveLine{fill:none;stroke:var(--blue);stroke-width:3}
#graph .drop{stroke:var(--gold);stroke-width:1;opacity:.5}
#graph .dot{fill:var(--gold);stroke:var(--ink);stroke-width:1.25}
#graph text{fill:var(--muted);font:11px var(--mono)}

.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--blue);
  background:var(--blue);color:#fff;cursor:pointer}
.actions button:hover{filter:brightness(1.1)}
.actions button.secondary{background:transparent;color:var(--blue)}
button:focus-visible,select:focus-visible,.stepper input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.msg{min-height:1.5em;margin:0 0 8px;font-size:.9rem;color:var(--muted)}
.table-wrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.9rem}
th,td{padding:7px 14px;text-align:right}
th:first-child,td:first-child{text-align:left;color:var(--muted)}
thead th{position:sticky;top:0;background:var(--paper);font-family:var(--sans);font-weight:600;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:var(--paper)}
td.value{font-weight:600}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-areas:"top" "controls" "graph" "results"}
}

body{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--serif);font-weight:400}
h1{font-size:2.2rem}
.panel{border-radius:20px}
.stepper,select,.actions button{border-radius:999px}
.stepper input{font-weight:500}
.curves{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
.curve span{border-radius:14px;padding:8px 2px}
#graph .dot{stroke:var(--card);stroke-width:2}
.actions button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
tbody tr:nth-child(even){background:transparent}
tbody tr{border-top:1px solid var(--line)}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Skinning calculator</h1>
    <p>Split a blend from 0 to 1 into evenly spaced steps and shape it with an easing curve. Useful for skin weights between bones.</p>
  </header>

  <section class="panel controls" aria-label="Settings">
    <div class="field">
      <label for="count">Values between 0 and 1</label>
      <div class="stepper">
        <button type="button" id="dec" aria-label="Decrease">&minus;</button>
        <input id="count" type="number" min="1" max="500" step="1" value="5" inputmode="numeric">
        <button type="button" id="inc" aria-label="Increase">+</button>
      </div>
      <p class="hint" id="countHint">The endpoints 0 and 1 are not included.</p>
    </div>

    <fieldset class="field">
      <legend>Curve</legend>
      <div class="curves" id="curves"></div>
    </fieldset>

    <div class="field">
      <label for="decimals">Decimal places</label>
      <select id="decimals">
        <option>2</option><option>3</option><option>4</option>
        <option selected>6</option><option>8</option>
      </select>
    </div>
  </section>

  <section class="panel graph-panel" aria-label="Curve preview">
    <div class="graph-head">
      <h2 id="curveName">Linear</h2>
      <span id="curveFormula" class="formula"></span>
    </div>
    <svg id="graph" viewBox="0 0 400 400" role="img" aria-label="Plot of the selected curve"></svg>
  </section>

  <section class="panel results" aria-label="Results">
    <div class="results-head">
      <h2>Results</h2>
      <div class="actions">
        <button type="button" id="copyLines">Copy as lines</button>
        <button type="button" class="secondary" id="copyCsv">Copy as comma list</button>
      </div>
    </div>
    <p id="msg" class="msg" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Position</th><th>Value</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
"use strict";

const CURVES = [
  { id: 1, name: "Linear",       formula: "v = t",
    fn: t => t },
  { id: 2, name: "Ease In",      formula: "v = t²",
    fn: t => t * t },
  { id: 3, name: "Ease Out",     formula: "v = 1 − (1 − t)²",
    fn: t => 1 - (1 - t) * (1 - t) },
  { id: 4, name: "Smoothstep",   formula: "v = 3t² − 2t³",
    fn: t => 3 * t * t - 2 * t ** 3 },
  { id: 5, name: "Smootherstep", formula: "v = 6t⁵ − 15t⁴ + 10t³",
    fn: t => 6 * t ** 5 - 15 * t ** 4 + 10 * t ** 3 },
  { id: 6, name: "Sine",         formula: "v = (1 − cos(πt)) / 2",
    fn: t => (1 - Math.cos(Math.PI * t)) / 2 },
  { id: 7, name: "Circular",     formula: "ease-in-out circ",
    fn: t => t < 0.5
      ? (1 - Math.sqrt(1 - (2 * t) ** 2)) / 2
      : (Math.sqrt(1 - (-2 * t + 2) ** 2) + 1) / 2 },
  { id: 8, name: "Exponential",  formula: "ease-in-out expo",
    fn: t => t === 0 ? 0 : t === 1 ? 1
      : t < 0.5 ? 2 ** (20 * t - 10) / 2
      : (2 - 2 ** (-20 * t + 10)) / 2 },
  { id: 9, name: "Tangent",      formula: "v = (tan((t − 0.5)·π/2) + 1) / 2",
    fn: t => (Math.tan((t - 0.5) * Math.PI / 2) + 1) / 2 },
  { id: 10, name: "Cubic In",     formula: "v = t³",
    fn: t => t ** 3 },
  { id: 11, name: "Cubic Out",    formula: "v = 1 − (1 − t)³",
    fn: t => 1 - (1 - t) ** 3 },
  { id: 12, name: "Cubic In-Out", formula: "ease-in-out cubic",
    fn: t => t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2 },
  { id: 13, name: "Quartic In-Out", formula: "ease-in-out quart",
    fn: t => t < 0.5 ? 8 * t ** 4 : 1 - (-2 * t + 2) ** 4 / 2 },
  { id: 14, name: "Sine In",      formula: "v = 1 − cos(πt/2)",
    fn: t => 1 - Math.cos(t * Math.PI / 2) },
  { id: 15, name: "Sine Out",     formula: "v = sin(πt/2)",
    fn: t => Math.sin(t * Math.PI / 2) },
  { id: 16, name: "Expo Out",     formula: "v = 1 − 2^(−10t)",
    fn: t => t === 1 ? 1 : 1 - 2 ** (-10 * t) },
  { id: 17, name: "Back In-Out",  formula: "overshoots 0–1",
    fn: t => { const c = 1.70158 * 1.525;
      return t < 0.5 ? ((2 * t) ** 2 * ((c + 1) * 2 * t - c)) / 2
                     : ((2 * t - 2) ** 2 * ((c + 1) * (t * 2 - 2) + c) + 2) / 2; } },
];

const MAX_COUNT = 500;
const $ = id => document.getElementById(id);
const countEl = $("count"), hintEl = $("countHint"), decEl = $("decimals");
const rowsEl = $("rows"), msgEl = $("msg"), graph = $("graph");
let mode = 1;
let values = [];
let msgTimer;

/* ---------- curve picker with mini thumbnails ---------- */
function thumbPath(fn) {
  let d = "";
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;
    d += (i ? "L" : "M") + (4 + t * 40).toFixed(1) + " " + (44 - (4 + fn(t) * 36)).toFixed(1);
  }
  return d;
}
$("curves").innerHTML = CURVES.map(c => `
  <label class="curve">
    <input type="radio" name="curve" value="${c.id}" ${c.id === mode ? "checked" : ""}>
    <span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="${thumbPath(c.fn)}"/></svg>${c.name}</span>
  </label>`).join("");

/* ---------- input handling ---------- */
function readCount() {
  const raw = countEl.value.trim();
  const n = Number(raw);
  if (raw === "" || !Number.isInteger(n) || n < 1) return { error: "Enter a whole number of 1 or more." };
  if (n > MAX_COUNT) return { error: `Maximum is ${MAX_COUNT} values.` };
  return { n };
}

function compute(n, curve) {
  const steps = n + 1;
  return Array.from({ length: n }, (_, k) => {
    const t = (k + 1) / steps;
    return { t, v: curve.fn(t) };
  });
}

function fmt(num, d) { return num.toFixed(d); }

/* ---------- rendering ---------- */
function drawGraph(curve, pts) {
  const P = 36, S = 400 - P * 2;               // plot area
  const X = t => P + t * S;
  const Y = v => 400 - P - v * S;
  let s = "";
  for (let i = 0; i <= 4; i++) {
    const g = i / 4;
    s += `<line class="grid" x1="${X(g)}" y1="${Y(0)}" x2="${X(g)}" y2="${Y(1)}"/>`;
    s += `<line class="grid" x1="${X(0)}" y1="${Y(g)}" x2="${X(1)}" y2="${Y(g)}"/>`;
    s += `<text x="${X(g)}" y="${Y(0) + 18}" text-anchor="middle">${g}</text>`;
    s += `<text x="${X(0) - 8}" y="${Y(g) + 4}" text-anchor="end">${g}</text>`;
  }
  s += `<line class="diag" x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}"/>`;
  s += `<line class="axis" x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(0)}"/>`;
  s += `<line class="axis" x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(1)}"/>`;

  let d = "";
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    const v = Math.min(1.3, Math.max(-0.3, curve.fn(t)));   // keep wild curves on screen
    d += (i ? "L" : "M") + X(t).toFixed(1) + " " + Y(v).toFixed(1);
  }
  s += `<defs><clipPath id="clip"><rect x="${P - 4}" y="${P - 4}" width="${S + 8}" height="${S + 8}"/></clipPath></defs>`;
  s += `<path class="curveLine" d="${d}" clip-path="url(#clip)"/>`;

  const r = pts.length > 100 ? 2 : pts.length > 40 ? 3.5 : 5;
  pts.forEach(p => {
    if (pts.length <= 60) s += `<line class="drop" x1="${X(p.t)}" y1="${Y(p.v)}" x2="${X(p.t)}" y2="${Y(0)}"/>`;
    s += `<circle class="dot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${r}" clip-path="url(#clip)"/>`;
  });
  graph.innerHTML = s;
}

function render() {
  const curve = CURVES.find(c => c.id === mode);
  $("curveName").textContent = curve.name;
  $("curveFormula").textContent = curve.formula;

  const res = readCount();
  if (res.error) {
    hintEl.textContent = res.error;
    hintEl.classList.add("error");
    return;
  }
  hintEl.textContent = curve.id === 17 ? "Back In-Out dips below 0 and goes above 1. Avoid it for skin weights." : "The endpoints 0 and 1 are not included.";
  hintEl.classList.remove("error");

  const d = Number(decEl.value);
  const pts = compute(res.n, curve);
  values = pts.map(p => fmt(p.v, d));
  rowsEl.innerHTML = pts.map((p, i) =>
    `<tr><td>${i + 1}</td><td>${fmt(p.t, d)}</td><td class="value">${values[i]}</td></tr>`).join("");
  drawGraph(curve, pts);
}

/* ---------- copy ---------- */
async function copy(text, label) {
  if (!values.length) return flash("Nothing to copy yet. Fix the number above first.");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  flash(`Copied ${values.length} values ${label}.`);
}
function flash(text) {
  msgEl.textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => (msgEl.textContent = ""), 3000);
}

/* ---------- events ---------- */
countEl.addEventListener("input", render);
decEl.addEventListener("change", render);
document.querySelectorAll('input[name="curve"]').forEach(r =>
  r.addEventListener("change", () => { mode = Number(r.value); render(); }));
function nudge(delta) {
  const n = Number(countEl.value);
  countEl.value = Math.min(MAX_COUNT, Math.max(1, (Number.isInteger(n) ? n : 1) + delta));
  render();
}
$("inc").addEventListener("click", () => nudge(1));
$("dec").addEventListener("click", () => nudge(-1));
$("copyLines").addEventListener("click", () => copy(values.join("\n"), "as lines"));
$("copyCsv").addEventListener("click", () => copy(values.join(", "), "as a comma list"));

render();
</script>
</body>
</html>
